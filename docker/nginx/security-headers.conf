# Security headers, mirrored 1:1 by vercel.json in Phase 14 so both hosting paths
# serve identical headers. One source of truth, two deployments.
#
# NOTE ON `always`: without it nginx omits these on error responses (404, 50x).
# NOTE ON INHERITANCE: add_header does NOT inherit into a location block that
# declares its own add_header. That is why this file is `include`d in every
# location rather than set once at server level.

# HTTPS only. Harmless over plain HTTP (browsers ignore it on non-secure origins),
# and correct the moment a TLS-terminating proxy sits in front of this container.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options    "nosniff"                        always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "DENY"                           always;
add_header Cross-Origin-Opener-Policy "same-origin"                   always;

# MOBILE_SPEC §9 mandates zero third-party requests, so `default-src 'self'` is
# achievable with nothing loosened.
#
# TODO (Phase 14): replace SCRIPT-HASH-PENDING with the real sha256 of the one
# inline head script from Phase 2 (`document.documentElement.classList.add('js')`).
# It is the only inline script on the page. Never fall back to 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-SCRIPT-HASH-PENDING'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
