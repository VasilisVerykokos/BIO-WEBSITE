# Static server for the built Astro site.
# Runs unprivileged: UID 101, no root, listening on 8080 rather than 80.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # Compression. Astro emits no .gz, so compress on the fly.
    # woff2, avif and webp are already compressed — never re-compress them.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    # ---- HTML: always revalidate -------------------------------------------
    # The HTML is the only unhashed entry point, so it must never be served
    # stale after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        try_files $uri $uri/index.html $uri.html =404;
    }

    # ---- Hashed build output: cache for a year -----------------------------
    # Every filename under /_astro/ carries a content hash, so the URL changes
    # whenever the bytes do. Safe to freeze.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
        try_files $uri =404;
    }

    # ---- Fonts -------------------------------------------------------------
    # Self-hosted woff2 (MOBILE_SPEC §9: zero third-party requests). Fontsource
    # files are content-hashed by Astro, so these are immutable too.
    location ~* \.(woff2|woff)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
        try_files $uri =404;
    }

    # ---- Images and media --------------------------------------------------
    location ~* \.(avif|webp|png|jpe?g|svg|ico|mp4|webm)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
        try_files $uri =404;
    }

    # ---- /cv.pdf -----------------------------------------------------------
    # BUILD_PLAN Phase 8: this path lives in sent applications for years and must
    # never change. It is NOT content-hashed, so it must revalidate — otherwise a
    # recruiter who opened it once gets a year-old cached CV.
    location = /cv.pdf {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        try_files $uri =404;
    }

    # Phase 13 adds 404.astro; until then nginx serves its own 404 body.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
